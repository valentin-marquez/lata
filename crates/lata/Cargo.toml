[package]
name = "lata"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steam = { path = "../steam" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
gpui-kit.workspace = true
image.workspace = true
auto-launch = "0.6"
sysinfo = { version = "0.31", default-features = false, features = ["system", "disk"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true

[build-dependencies]
embed-resource = "3"

