[package]
name = "lata"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steam = { path = "../steam" }
zomboid = { path = "../zomboid" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
gpui-kit.workspace = true
image.workspace = true
auto-launch = "0.6"
sysinfo = { version = "0.31", default-features = false, features = ["system", "disk"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
# The game names a server's cached world after the MD5 of the username played there.
md-5 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# The updater: the checksum of what it downloads, and the Linux package (a .tar.gz).
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }

# The system tray on Windows: the icon, and hiding the window (a call GPUI lacks, added in
# vendor/gpui-pre-windows).
[target.'cfg(windows)'.dependencies]
gpui-windows = { package = "gpui-pre-windows", version = "=0.3.12" }
raw-window-handle = "0.6"
tray-icon = { version = "0.26", default-features = false }

# The system tray on Linux: a StatusNotifierItem over D-Bus (tray-icon would need GTK), and zbus
# to ask the session bus whether anything shows such items.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints]
workspace = true

[build-dependencies]
embed-resource = "3"

