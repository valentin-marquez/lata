[package]
name = "zomboid"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What lata knows about Project Zomboid's own files: the game version, the build catalog."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip's deflate needs a flate2 backend; the default one is pure Rust.
flate2 = "1"

[dev-dependencies]
# The catalog example talks to Steam anonymously.
steam = { path = "../steam" }
reqwest = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
