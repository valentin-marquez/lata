name: CI

# The launcher. The browser extension has its own workflow (extension.yml), and neither it nor
# a change to the docs needs three systems compiling Rust.
on:
  push:
    branches: [main]
    paths-ignore: ["extension/**", "**.md", ".github/workflows/extension.yml"]
  pull_request:
    paths-ignore: ["extension/**", "**.md", ".github/workflows/extension.yml"]

concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: every commit on main gets its full check, and a run that is cancelled
  # saves no cache, which left the next one building from nothing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Nobody debugs a CI build: without debug info it compiles and links faster and the cache
  # is much smaller.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # gpui and keyring link these; the Wayland and X11 libraries themselves load at run time.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libdbus-1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libwayland-dev

      - name: Rust
        run: rustup toolchain install stable --profile minimal -c rustfmt -c clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The tests that talk to Steam are #[ignore]d, so this needs no network.
      - name: Test
        run: cargo test --workspace
