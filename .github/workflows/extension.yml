name: Extension

# lata link, the browser extension in `extension/`. It has its own versions and tags
# (`extension-v0.1.0`), apart from the launcher's (`v*`, see release.yml). A change to the
# extension is checked and packaged here; a tag also attaches the package to a draft release.
# The stores are uploaded to by hand, from that package.
on:
  push:
    branches: [main]
    paths: ["extension/**", ".github/workflows/extension.yml"]
    tags: ["extension-v*"]
  pull_request:
    paths: ["extension/**", ".github/workflows/extension.yml"]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mozilla's own check of the manifest and scripts, the one the Firefox store runs on upload.
      - name: Lint
        run: npx --yes web-ext@8 lint --source-dir extension

      # What the package is called: the manifest's version, which a tag has to match so a
      # release never ships under another number.
      - name: Version
        run: |
          version="$(jq -r .version extension/manifest.json)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "extension-v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Only what the browser loads, with manifest.json at the top of the archive.
      - name: Package
        run: |
          mkdir -p dist
          cd extension
          zip -r "../dist/lata-link-$VERSION.zip" manifest.json content.js content.css _locales icons

      - uses: actions/upload-artifact@v4
        with:
          name: lata-link
          path: dist/*
          if-no-files-found: error

  # Only for a tag. The release stays a draft: nothing is public until someone publishes it.
  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/extension-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lata-link
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft \
                 --title "lata link ${GITHUB_REF_NAME#extension-v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
