[workspace]
resolver = "3"
members = ["crates/*"]
# Patched dependencies; each folder lists its changes in LATA-PATCHES.md.
exclude = ["vendor"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
gpui-kit = "0.9.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# GPUI is very slow unoptimized; optimize dependencies, keep our crate fast to rebuild.
[profile.dev.package."*"]
opt-level = 2

# Chunk decrypt and LZMA run about 5x slower unoptimized, which made dev installs CPU-bound.
[profile.dev.package.steam]
opt-level = 3

# gpui-component patched for things it can't do yet (see vendor/gpui-component/LATA-PATCHES.md).
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
# gpui's Linux backend, patched to copy images (see vendor/gpui-pre-linux/LATA-PATCHES.md).
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# gpui's Windows backend, patched to hide a window and show a hidden one (see
# vendor/gpui-pre-windows/LATA-PATCHES.md).
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
